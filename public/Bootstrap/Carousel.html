<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"/>
    <link rel="stylesheet"href="../../node_modules/bootstrap/dist/css/bootstrap.css"/>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="carousel slide" data-bs-theme="dark" id="banners" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active"  data-bs-interval="1000ms">
                <img src="../images/slide-1.jpg" alt="" height="500" class="w-100">
            </div>
               <div class="carousel-item active" data-bs-interval="2000ms">
                <img src="../images/slide-2.jpg" alt="" height="500" class="w-100" >
            </div>
               <div class="carousel-item active" data-bs-interval="500ms">
                <img src="../images/slide-3.jpg" alt="" height="500" class="w-100" >
            </div>
        </div>
         <button class="carousel-control-prev" data-bs-target="#banners" data-bs-slide="prev"> <span class="carousel-control-prev-icon"></span></button>
         <button class="carousel-control-next" data-bs-target="#banners" data-bs-slide="next"><span class="carousel-control-next-icon"></span> </button>
        
         <div class="carousel-indicators">
            <button  class="active "  style="height: 20px ; width: 20px; border-radius: 100%;"  data-bs-target="#banners" data-bs-slide-to="0" aria-label="slide-1" aria-current="true">1</button>
            <button class="" style="height: 20px ; width: 20px; border-radius: 100%;" data-bs-target="#banners" data-bs-slide-to="1" aria-label="slide-2">2</button>
            <button class="" style="height: 20px ; width: 20px; border-radius: 100%;" data-bs-target="#banners" data-bs-slide-to="2" aria-label="slide-3">3</button>
         </div>
    </div>
</body>
</html>

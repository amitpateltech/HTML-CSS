<body class="d-flex justify-content-center">

    <form action="" class="d-flex flex-row">
        <div class="me-5 mt-3">

            <div class="mt-3">
                <label class="form-label" for="name">Name</label>
                <div> 
                    <input type="text" name="" id="name" class="form-control mb-2">
                </div>
            </div>
           <div>
            <label for="gender" class="form-label">Gender</label>
            <div class="d-flex">
               <div class="me-5"> <input type="checkbox" name="" id="" class="checkbox" ><span >Male</span></div>
                <div><input type="checkbox" name="" id="" class="checkbox"><span> Female</span></div>
            </div>
           </div>
           <div>
            <label for="age" class="form-label">Age</label>
            <div>
                <input type="number" id="age" class="form-control mb-2">
            </div>
           </div>
           <div class="fs-5 fw-bold mt-3">University Datails</div>
           <div>
            <label for="Faculty" class="form-label">Faculty</label>
            <div>
                <select name="" id="" class="input-text-group w-100 p-2 form-control mb-2">
                    <option value="">Bhu</option>
                    <option value="">Du</option>
                    <option value="">cu</option>
                </select>
            </div>
           </div>
            <div>
            <label for="Faculty" class="form-label">Department</label>
            <div>
                <select name="" id="" class="input-text-group w-100 p-2 form-control">
                    <option value="">CS</option>
                    <option value="">MBA</option>
                    <option value="">MCA</option>
                </select>
            </div>
           </div>
        </div>
        <div class="mt-3">
            <div>Contact Information</div>
            <div class="mt-3">
                <label for="email" class="form-label">Email</label>
                <div> 
                    <input type="email" name="" id="email" class="form-control mb-2">
                </div>
            </div>
            <div>
                <label for="number" class="form-label">Mobile Number</label>
                <div> 
                    <input type="number" name="" id="number" class="form-control mb-2">
                </div>
            </div>

            <div class="mt-3 mb-3 fs-4">Carreer Counsling Service</div>
            <div class="fs-6 mb-3 text-info">Career Counsling Service 45 minutes  <br>provided by Cario University to advise <br> studetns on their best career advice.</div>
            <div class="mb-3">
                <input type="checkbox" class="checkbox">
                <span>I want to book the careere counseling session</span>
            </div>
            <button type="button" class=" btn btn-info bg-succes border p-2 rounded">Submit</button>
        </div>

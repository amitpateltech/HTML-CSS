<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <title>Document</title>
</head>
<body class="d-flex justify-content-center mt-3">
    <form action="" class="w-25 p-4 border border-dark rounded">
        <div class="fs-4 fw-bold text-center"><span class="bi bi-lock"></span>Forgot Password</div>
        <div>
            <label for="name" class="form-label">Email</label>
            <div class="input-box">
                <input type="email" class="form-control">
            </div>
        </div>
        <div>
            <label for="name" class="form-label">Verification code</label>
            <div class="input-box d-flex ">
                <input type="text" class="form-control">
                <button class="btn btn-outline-primary text-nowrap ms-3">Send code</button>
            </div>
        </div>
        <div>
            <label for="name" class="form-label">New password</label>
            <div class="input-box">
                <input type="password" class="form-control">
            </div>
        </div>
        <div>
            <label for="" class="form-label">Confirm password</label>
            <div>
                <input type="password" class="form-control">
            </div>
        </div>
        <button class="btn btn-outline-success w-100 p-2 mt-3"> <span class="bi bi-lock"></span>Reset password</button>
    </form>
</body>
</html>

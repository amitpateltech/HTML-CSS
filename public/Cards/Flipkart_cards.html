<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>Document</title>
    <style>
        .container{
            background-image: linear-gradient(blue,rgb(40, 40, 115),rgb(101, 101, 181));

            padding: 20px;
          font-family: Arial;

            display: flex;
            
        }

        }
        .card{
            
           margin: 15px;

        }

            color: white;
            font-weight: bold;
            margin-top: 10px;
           
        }

        }

            margin-left: 10px;
        }

            padding: 15px;
            margin-top: -5px;
            font-weight: bold;
            box-shadow: 3px 3px 3px black;
        }
    </style>
</head>

    <div class="container">

        <div class="control">

        </div>
        <div class="card">

        </div>
        <div class="card">

            <div class="price">From &#8377;5,999</div>
            <div class="descrition">LG and Pro </div>
        </div>
        <div class="card">
            <img class="product" src="../images/buds.jpg" alt="">
            <div class="discount">60% OFF</div>
            <div class="price">From &#8377;5,999</div>
            <div class="descrition">Apple Buds and More</div>

        <div class="card">

        </div>

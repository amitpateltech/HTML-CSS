<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        body{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        form{
            border: 1px solid rgb(209, 208, 208);
            padding: 25px;
            width: 400px;
          font-family: Arial;
          border-radius: 10px;
        }
        .email{
            width: 95%;
            padding: 15px;
            margin-bottom: 30px;
            margin-top: 5px;
        }
        .mobile{
            font-weight: bolder;
        }
        .title{
            font-size: 45px;
            margin-bottom: 30px;
        }
        .btn{
            width: 103%;
            padding: 20px;
            background-color: rgb(234, 206, 21);
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </Style>
</head>
<body>
    <form action="">
        <div class="title">Sign in or create account</div>
        <div>
            <label class="mobile" for="no">Enter mobile number or email</label>
        </div>
        <input class="email" type="text" id="no" name="email" placeholder="number or email">

        <div>
            <label class="mobile" for="no">Enter password</label>
        </div>
        <input class="email" type="text" id="no" name="email" placeholder="password">
        <button class="btn">Sign In</button>
    </form> 
</body>
</html>

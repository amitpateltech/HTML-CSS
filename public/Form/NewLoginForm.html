<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body{
            display: flex;
            justify-content: center;
        }
        img{
            width: 400px;
            height: 580px;
            border-radius: 5px;
           
        }
        form{
            display: flex;
            font-family: Arial;
            background-color: rgb(47, 43, 49);
            width: 70%;
            padding: 15px;
            color: white;
            border-radius: 4px;
            justify-content: space-between;
        }
        
        .blue{
            color: rgb(106, 60, 198);
            text-decoration: underline;
        }
      .name{
     
        display: flex;
        flex-direction: row;
       
      }
     .a{
        width: 200px;
         padding: 15px;
         margin-right: 15px;
         border-radius: 10px;
         border: 1px solid gray;
         margin-bottom: 15px;
     }
     .b{
        width: 90%;
        padding: 15px;
         border-radius: 10px;
         border: 1px solid gray;
         margin-bottom: 15px;
     }
     .mtitle{
        font-size: 50px;
        text-align: center;
     }
     .link{
        display: flex;
     }
     .slink{
        border: 1px solid gray;
        padding: 15px;
         width: 200px;
         text-align: center;
         border-radius: 10px;
         margin-right: 15px;
     }
     button{
         width: 97%;
         padding: 15px;
         border-radius: 10px;
         border: 1px solid gray;
         margin-bottom: 15px;
         margin-top: 10px;
         margin-bottom: 10px;
         background-color: rgb(98, 15, 206);
         color: white;
         font-weight: bold;
         margin-top: 30px;
         margin-bottom: 40px;
     }
     .tt{
        margin-top: 20px;
        margin-bottom: 40px;
     }
     #main{
        padding: 30px;
       
     }
     fieldset{
        border-left: none;
        border-right: none;
        border-bottom: none;
        text-align: center;
     }
       .bi-google{
       
            color: transparent;
            background-image: linear-gradient(to bottom, red ,yellow,green ,blue);
            background-clip: text;
        }
        a{
            text-decoration: none;
            color: white;
        }
        .ag{
           
        }
        .img{
            position: relative;
        }
        .title{
            
            display: flex;
            justify-content: space-between;
        }
        .head{
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 30px;
            font-family: monospace;
            font-style: italic;

        }
        .arr{
            position: absolute;
            top:15px;
            right: 10px;
            background-color: rgb(113, 111, 111);
            padding: 5px;
            border-radius: 15px;
        }
        .sub{
            text-align: center;
            position: absolute;
            bottom: 65px;
            right: 120px;
            font-size: 22px;
        }
        .sub1{
            text-align: center;
            position: absolute;
            right: 120px;
            bottom: 40px;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <form action="">
        <div class="img">
            <img  src="../images/m2.jpg" alt="">
            <div class="title">
                <span class="head">AMU</span>
                <span class="arr">Back to website <span class="bi bi-arrow-right"></span></span>
            </div>
            <div>
                <div class="sub">Capturing Moments</div>
                <div class="sub1">Creating Memories</div>
            </div>
        </div>
        <div id="main">
            <div class="mtitle">Creat an account</div>
            <div class="tt">Already have accound <span class="blue">Login</span></div>
            <div class="name">
                <input class="a" type="text" placeholder="First Name">
                <input class="a" type="text" placeholder="Last Name">
            </div>
            <div>
                <input class="b" type="email" placeholder="Email">
            </div>
            <div>
                <input class="b" type="password" placeholder="Enter Your Password">
            </div>
            <div class="ag">
               <input type="checkbox">
                <span>I agree to the <span class="blue">Terms & Conditions</span></span>
            </div>
            <button>Create an account</button>
            <div><fieldset><legend>or registerd with</legend></fieldset></div>
           <div class="link">
             <a href="https://mail.google.com/?utm_source=chatgpt.com">
                <div class="slink">
                <span class="bi bi-google"></span>
                <span>Goggle</span>
            </div>
             </a>
            <a href="https://www.apple.com/in/">
                <div class="slink">
                <span class="bi bi-apple"></span>
                <span>Apple</span>
            </div>
            </a>
           </div>
        </div>
    </form>
</body>
</html>

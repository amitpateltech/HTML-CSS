<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>BootStrap-Icons</title>
    <style>
        header{
            background-color: rgb(75, 54, 139);
            color: white;
            padding: 10px;
            font-family: Arial;
            font-size: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .bi-bootstrap-fill{
            font-size: 30px;
        }
        nav span{
            margin: 20px;
        }
         .search-bar{
            width: 250px;
            background-color: rgb(25, 24, 90);
            padding: 8px;
            font-size: 18px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            border-radius: 8px;
            align-items: center;
         }
         .btn-cmd{
            background-color: rgb(37, 37, 148);
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
         }
         .bi-command{
            font-size: 14px;
         }
         .quick-links{
            display: flex;
            flex-direction: row;
         }
         .quick-links span{
            margin-right: 10px;
         }
         .bi-caret-down-fill{
            font-size: 12px;
         }
         aside{
            border-right: 1px solid;
            margin-right: 20px;
         }
         .bi-sun-fill{
            border-left: 1px solid;
            padding-left: 15px;
         }
    </style>
</head>
<body>
  <header>
     <div>
    <nav>
         <span class="bi bi-bootstrap-fill"></span>
         <span>Docs</span>
         <span>Examples</span>
         <span>Icons</span>
         <span>Blog</span>
    </nav>
   </div> 
   
   <div class="search-bar">
    <span class="bi bi-search">  Search</span>
    <div class="btn-cmd">
        <span class="bi bi-command"></span>
        <span class="k">K</span>
    </div>
   </div>
   

   <div class="quick-links">
     <aside>
         <span class="bi bi-github"></span>
         <span class="bi bi-twitter-x"></span>
         <span class="bi bi-opencollective"></span>
     </aside>
     <div class="shortcut">
         <span>v5.3 <span class="bi-caret-down-fill" ></span></span>
         <span> <span class="bi bi-sun-fill" ></span><span class="bi bi-caret-down-fill"></span>
     </div>
   </div>
  </header>
</body>
</html>

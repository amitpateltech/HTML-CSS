<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="../images/bootstrap.ico">
    <title>Bootstrap-Icons</title>
    <style>
        body{
            background-color: black;
            
        }
        header{
            background-color: rgb(114, 49, 226);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 15px;
            font-family: Arial;
            color: whitesmoke;
            align-items: center;
        }
       nav span{
        margin-right: 15px;
       }
       .bi-bootstrap-fill{
        font-size: 30px;
       }
       .search-bar{
        display: flex;
        border: 1px solid;
        padding: 6px;
        width: 250px;
        justify-content:space-between;
        border-radius: 4px;
        margin-right: 130px;
        color: rgb(187, 182, 182);
        background-color: rgba(88, 19, 208, 0.746);
        align-items: center;
       }
       .search{
        margin-left: 7px;
       }
       .btn-k{
        background-color: rgb(44, 5, 161);
        padding: 2px;
       width: 25px;
       border-radius: 4px;
       display:flex;
       }
       .bi-command{
        font-size: 10px;
        margin-right: 3px;
       margin-top: 3px;
       }
       .quick-links{
        display: flex;
        flex-direction: row;
        color: white;
       }
       aside{
        margin-right: 10px;
    
       }
       a span{
        margin-right: 10px;
       }
       .bi-github{
        color: white;
       }
       .bi-twitter-x{
        color: white;
       }
       .bi-opencollective{
        color: white;
       } 
       .bi-moon-stars-fill{
        border-left: 1px solid gray;
        padding: 6px;
        margin-right: 100px;
       }
       .v{
        border-left: 1px solid gray;
        padding: 6px;
        
    }
    </style>
</head>
<body>
    <header>
        <div >
            <nav >
                <span class="bi bi-bootstrap-fill"></span>
                <span>Docs</span>
                <span>Examples</span>
                <span>Icons</span>
                <span>Blog</span>
            </nav>
        </div>


        <div>
            <div class="search-bar">
                <span class="bi bi-search"><span class="search">Search</span></span>
               <div class="btn-k">
                <span class="bi bi-command"></span>
                <span>K</span>
               </div>
            </div>
        </div>


        <div class="quick-links">
            <aside>
                <a href="https://github.com/AmitPatelup65"><span class="bi bi-github"></span></a>
                <a href="https://x.com/"><span class="bi bi-twitter-x"></span></a>
                <a href="https://opencollective.com/bootstrap"><span class="bi bi-opencollective"></span></a>
            </aside>
            <div class="shortcut">
                <span class="v">v5.3 <span class="bi bi-caret-down-fill"></span></span>
                <span class="bi bi-moon-stars-fill"> <span class="bi bi-caret-down-fill"></span></span>
            </div>
        </div>
    </header>
</body>
</html>

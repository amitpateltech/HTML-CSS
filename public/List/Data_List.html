<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        dt{
            background-color: rgb(165, 162, 162);
            padding: 5px;
            width: 100px;
            text-align: center;
            border-radius: 5px;
            margin-top: 5px;
          
        }
        dd{
            background-color: lightgray;
            padding: 5px;
            margin-top: 5px;
            border-radius: 5px;
           
        }
        dl{
            display: grid;
            grid-template-columns: 1fr 11fr;
        }

    </style>
</head>
<body>
    <dl>
        <dt>HTML</dt>
        <dd>It is a Markup language</dd>
        <dt>CSS</dt>
        <dd>Casecade Style Sheet</dd>
        <dt>JAVA</dt>
        <dd>It is used for backend</dd>
        <dt>SQL</dt>
        <dd>It is used for retrive and modify data from the data base</dd>
    </dl>
</body>
</html>

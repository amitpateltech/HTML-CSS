<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            width: 20vw;
            margin-top: 100px;
            margin-left: 20px;
            height: 50vh;
            border: 1px solid;
            overflow: hidden;
            position: relative;
        }
        img{
        width: 100%;
        height: 100%;
        transition-duration: 0.6s;
        }
        .card:hover img{
            transform: scale(1.05);
            transition-duration: 0.8s;
          
        }
        .card:hover .title{
            transform: translateY(-20px);
            transition-duration: 0.8s;
        }
        .title{
            font-weight: bold;
            font-size: large;
            position: absolute;
            bottom:30px;
            left:80px;
            transition-duration:1s;
        }
        .card:hover .shop{
            display: block;
            transform: translateY(-15px);
            transition-duration: 0.5s;
            visibility: visible;
            opacity: 3;
        }
        .shop{
            position: absolute;
            bottom:8px;
            left:130px;
            font-size: 17px;
            text-decoration: underline;
            color: rgb(215, 138, 14);
            visibility: hidden;
            transition-duration: 0.7s;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="card">
         <img src="../images/f1w.avif" alt="">
        <div class="title">Women's Fashion</div>
        <div class="shop">Shop</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #h{
            display: none;
        }  
        #h:has(+input:focus){
            display: block;
            font-family: Arial;
            color: red;
            font-size: 13px;
            padding-top: 5px;
        }
        .d{
            background-color: navy;
            border: 1px solid gray;
            padding: 10px;
            width: 200px;
        }
        .d:hover{
            background-color: blue;
        }
        .d:active{
            background-color: red;
        }
      button{
             background-color: orangered;
            color: white;
            border: 1px solid gray;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }
        #check:checked+button{
           
            display: block;
        }
    </style>
</head>
<body>
    <div class="d">
        <p></p>
        <div id="h">Enter Your Full Name</div>
        <input id="input" type="text">
        <input id="input" type="text" readonly>
        <input type="text" name="" id="" disabled placeholder="disabled">
        <input id="check" type="checkbox">
        <button>Submit</button>
    </div>

</body>
</html>

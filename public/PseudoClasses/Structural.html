<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:nth-last-of-type(5n+3){
            color: green;
        }
        span:first-child{
            color: red;
        }
        p:last-child{
            color: blue;
            border: 1px solid red;
            border-radius: 10px;
            padding: 5px;
            width: 100px;
        }
    </style>
</head>
<body>
    <ul> 
        <li>Html</li>
        <li>Html</li>
        <li>Html</li>
        <li>Html</li>
        <li>Html</li>
        <li>Html</li>
        <li>Html</li>
        <li>Html</li>
    </ul>
    <div>
        <span>Css</span>
        <span>Css</span>
        <span>Css</span>
        <span>Css</span>
    </div>
    <div>
        <p>Java</p>
        <p>Java</p>
        <p>Java</p>
        <p>Java</p>
        <p>Java</p>
    </div>
</body>
</html>
